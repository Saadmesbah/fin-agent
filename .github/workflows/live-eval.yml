name: Optional live model evaluation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install duckdb==1.5.6 sqlglot==30.32.0 requests==2.34.2 python-dotenv==1.2.4 PyYAML==6.0.3
      - run: python -m tests.build_fixture
      - name: Measure model SQL execution accuracy
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: python -m eval.eval_sql --live --output ci-results/sql_live.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-sql-evaluation
          path: ci-results/
