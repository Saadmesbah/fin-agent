<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Fin Agent · SEC filings</title>
<style>body{font:16px system-ui;max-width:850px;margin:55px auto;padding:0 22px;background:#101923;color:#eaf1f5}h1{font-size:44px}p{color:#abbecb}textarea,select,button{font:inherit;padding:12px;border-radius:7px;margin:7px 0}textarea{box-sizing:border-box;width:100%;min-height:95px}button{background:#77dec0;border:0;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1d2c39;padding:20px}label{margin-right:12px}a{color:#77dec0}</style>
<h1>Fin Agent</h1><p>Ask about company financials and annual filings. Answers include SQL results or cited passages.</p>
<form id="form"><textarea id="question" aria-label="Question" required>What are Microsoft's reportable segments?</textarea>
<label>Company <select id="ticker"><option value="">Detect automatically</option><option>MSFT</option><option>AAPL</option><option>JNJ</option><option>NVDA</option><option>WMT</option><option>HD</option><option>CVX</option><option>PFE</option><option>KO</option><option>PG</option><option>CAT</option></select></label>
<label>Route <select id="route"><option>auto</option><option>sql</option><option>rag</option><option>both</option></select></label>
<label>Search <select id="mode"><option>vector</option><option>hybrid</option><option>rerank</option></select></label>
<button id="submit">Ask</button></form><p>Documents: AAPL, MSFT, JNJ. Structured data: 11 companies. Verify answers against their sources. <a href="/docs">API docs</a></p>
<pre id="answer" role="status">Ready.</pre><details><summary>Sources and SQL</summary><pre id="sources"></pre></details>
<script>document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const b=document.querySelector('#submit'),a=document.querySelector('#answer');b.disabled=true;a.textContent='Retrieving evidence and preparing an answer…';document.querySelector('#sources').textContent='';try{const r=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:document.querySelector('#question').value,ticker:document.querySelector('#ticker').value||null,route:document.querySelector('#route').value,retrieval_mode:document.querySelector('#mode').value})});const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));a.textContent=d.answer;document.querySelector('#sources').textContent=JSON.stringify({route:d.route,sql:d.sql_result,sources:d.sources},null,2)}catch(err){a.textContent=err.message}finally{b.disabled=false}};</script></html>
